<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" role="img"><title>Trunk-Based · mudanças pequenas voltam cedo</title><rect width="1180" height="590" rx="20" fill="#f7f8fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#243449">Trunk-Based · mudanças pequenas voltam cedo</text><text x="35" y="78" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Exemplo com branches curtas e revisão; também existem equipes com integração direta controlada.</text><path d="M200 112H1110" fill="none" stroke="#a8b1bf" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="118" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Tempo →</text><text x="35" y="236" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">main</text><path d="M200 230H1100" fill="none" stroke="#295c97" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 230L255 360H315L370 230" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="220" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="285" cy="360" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="370" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="245" y="395" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243449">mudança 1</text><path d="M440 230L475 410H535L590 230" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="440" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="505" cy="410" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="590" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="465" y="445" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243449">mudança 2</text><path d="M660 230L695 360H755L810 230" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="660" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="725" cy="360" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="810" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="685" y="395" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243449">mudança 3</text><path d="M880 230L915 410H975L1030 230" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="880" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="945" cy="410" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="1030" cy="230" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="905" y="445" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243449">mudança 4</text><text x="35" y="500" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">A frequência de integração importa: commits isolados não bastam.</text><text x="35" y="530" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Branches curtas podem usar PRs. Revisões e testes continuam necessários.</text><text x="35" y="560" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#243449">Pode se sobrepor ao GitHub Flow quando o trabalho retorna rapidamente à principal.</text></svg>