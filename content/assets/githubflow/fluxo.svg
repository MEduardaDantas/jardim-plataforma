<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img"><title>GitHub Flow · mudança, revisão e integração</title><rect width="1180" height="610" rx="20" fill="#f7f8fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#243449">GitHub Flow · mudança, revisão e integração</text><text x="35" y="78" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Uma principal duradoura; cada proposta de mudança usa uma branch.</text><path d="M200 112H1110" fill="none" stroke="#a8b1bf" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="118" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Tempo →</text><text x="35" y="206" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">main</text><path d="M200 200H1100" fill="none" stroke="#295c97" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="346" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">mudança A</text><path d="M300 340H520" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 200L300 340" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 340L650 200" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="456" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">mudança B</text><path d="M780 450H950" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 200L780 450" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M950 450L1070 200" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="230" cy="200" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="360" cy="340" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="470" cy="340" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="650" cy="200" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="700" cy="200" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="830" cy="450" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="930" cy="450" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="1070" cy="200" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="325" y="385" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#243449">PR + revisão + verificações</text><text x="760" y="495" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#243449">PR + revisão + verificações</text><text x="35" y="550" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Sem etapa obrigatória por develop ou release. Publicação segue a política do projeto.</text><text x="35" y="580" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#243449">O nome da branch ajuda a identificar o trabalho; não define sozinho o modelo.</text></svg>