<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" role="img"><title>Git Flow · caminhos diferentes por finalidade</title><rect width="1180" height="780" rx="20" fill="#f7f8fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="35" y="45" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#243449">Git Flow · caminhos diferentes por finalidade</text><text x="35" y="78" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">main e develop são duradouras; feature, release e hotfix têm destinos de integração definidos.</text><path d="M200 112H1110" fill="none" stroke="#a8b1bf" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="118" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Tempo →</text><text x="35" y="186" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">main</text><path d="M200 180H1100" fill="none" stroke="#295c97" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="386" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">develop</text><path d="M200 380H1100" fill="none" stroke="#358268" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="286" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">hotfix</text><path d="M360 280H490" fill="none" stroke="#b34665" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 180L360 280" fill="none" stroke="#b34665" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 280L560 180" fill="none" stroke="#b34665" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 280L560 380" fill="none" stroke="#b34665" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="486" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">feature</text><path d="M290 480H470" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 380L290 480" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 480L580 380" fill="none" stroke="#8053ad" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="586" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243449">release</text><path d="M740 580H880" fill="none" stroke="#af6d21" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 380L740 580" fill="none" stroke="#af6d21" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 580L1020 180" fill="none" stroke="#af6d21" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 580L970 380" fill="none" stroke="#af6d21" stroke-width="3" marker-end="url(#arrow)"/><circle cx="220" cy="380" r="7" fill="white" stroke="#358268" stroke-width="3"/><circle cx="300" cy="180" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="420" cy="280" r="7" fill="white" stroke="#b34665" stroke-width="3"/><circle cx="560" cy="180" r="7" fill="white" stroke="#295c97" stroke-width="3"/><circle cx="560" cy="380" r="7" fill="white" stroke="#358268" stroke-width="3"/><circle cx="360" cy="480" r="7" fill="white" stroke="#8053ad" stroke-width="3"/><circle cx="580" cy="380" r="7" fill="white" stroke="#358268" stroke-width="3"/><circle cx="650" cy="380" r="7" fill="white" stroke="#358268" stroke-width="3"/><circle cx="800" cy="580" r="7" fill="white" stroke="#af6d21" stroke-width="3"/><circle cx="970" cy="380" r="7" fill="white" stroke="#358268" stroke-width="3"/><circle cx="1020" cy="180" r="7" fill="white" stroke="#295c97" stroke-width="3"/><text x="35" y="655" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Feature: sai de develop e volta para develop.</text><text x="35" y="686" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Release: sai de develop; integra na principal e devolve ajustes ao desenvolvimento.</text><text x="35" y="717" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243449">Hotfix: sai da principal; correção retorna à principal e ao desenvolvimento.</text><text x="35" y="748" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243449">Se há release em andamento, o destino da correção segue a regra desse ciclo.</text></svg>