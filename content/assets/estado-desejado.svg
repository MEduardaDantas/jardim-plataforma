<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img"><title>O estado desejado vira uma declaração em arquivos</title><rect width="1100" height="660" rx="20" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#173047}.title{font-size:28px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.line{font-size:17px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53788e"/></marker></defs><text x="36" y="48" class="title">O estado desejado vira uma declaração em arquivos</text><text x="36" y="80" class="sub">Trechos parciais Kubernetes: documentos descrevem recursos; arquivos não são recursos em execução.</text><rect x="36" y="115" width="500" height="230" rx="14" fill="#e0eefc" stroke="#a7bdcc"/><text x="58" y="149" class="head">deploy/portal/deployment.yaml</text><text x="58" y="184" class="code" xml:space="preserve">kind: Deployment</text><text x="58" y="213" class="code" xml:space="preserve">metadata: {name: portal}</text><text x="58" y="242" class="code" xml:space="preserve">spec:</text><text x="58" y="271" class="code" xml:space="preserve">  replicas: 2</text><text x="58" y="300" class="code" xml:space="preserve">  # imagem e configuração dos Pods</text><rect x="560" y="115" width="504" height="230" rx="14" fill="#e3f3e8" stroke="#a7bdcc"/><text x="582" y="149" class="head">deploy/portal/service.yaml</text><text x="582" y="184" class="code" xml:space="preserve">kind: Service</text><text x="582" y="213" class="code" xml:space="preserve">spec:</text><text x="582" y="242" class="code" xml:space="preserve">  selector: {app: portal}</text><text x="582" y="271" class="code" xml:space="preserve">  ports: [{port: 80}]</text><text x="582" y="300" class="code" xml:space="preserve">  # acesso de rede aos Pods</text><path d="M285 345 L285 395" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 345 L810 395" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="400" width="1028" height="102" rx="14" fill="#ffffff" stroke="#a7bdcc"/><text x="58" y="434" class="head">Juntos, esses arquivos expressam parte do que queremos</text><text x="58" y="469" class="line">Deployment: duas réplicas do portal. Service: acesso interno aos Pods selecionados.</text><rect x="36" y="525" width="1028" height="100" rx="14" fill="#eee7fa" stroke="#a7bdcc"/><text x="58" y="559" class="head">A Application aponta para a pasta; não contém toda a configuração</text><text x="58" y="594" class="line">Repositório + revisão + caminho → Argo CD obtém e aplica os manifests no destino.</text></svg>