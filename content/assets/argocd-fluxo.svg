<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><title>Quem configura, quem aplica e quem mantém?</title><rect width="1100" height="760" rx="20" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#173047}.title{font-size:28px;font-weight:bold}.sub{font-size:17px}.head{font-size:20px;font-weight:bold}.line{font-size:17px}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53788e"/></marker></defs><text x="36" y="48" class="title">Quem configura, quem aplica e quem mantém?</text><text x="36" y="80" class="sub">Argo CD está instalado em um cluster e pode gerenciar esse cluster ou outros destinos.</text><path d="M350 212 L435 212" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 410 L435 300" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M705 280 L780 280" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M910 365 L910 460" fill="none" stroke="#53788e" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="115" width="314" height="190" rx="14" fill="#eee7fa" stroke="#a7bdcc"/><text x="58" y="149" class="head">Application</text><text x="58" y="184" class="line">Repositório e revisão</text><text x="58" y="213" class="line">Pasta dos manifests</text><text x="58" y="242" class="line">Cluster e namespace</text><text x="58" y="271" class="line">Política de sincronização</text><rect x="36" y="350" width="314" height="150" rx="14" fill="#e0eefc" stroke="#a7bdcc"/><text x="58" y="384" class="head">Fonte versionada</text><text x="58" y="419" class="line">deployment.yaml</text><text x="58" y="448" class="line">service.yaml</text><text x="58" y="477" class="line">Outros recursos declarados</text><rect x="435" y="155" width="270" height="245" rx="14" fill="#e2f1ee" stroke="#a7bdcc"/><text x="457" y="189" class="head">Argo CD</text><text x="457" y="224" class="line">Lê a Application</text><text x="457" y="253" class="line">Obtém os manifests</text><text x="457" y="282" class="line">Compara com o cluster</text><text x="457" y="311" class="line">Sincroniza pela API</text><text x="457" y="340" class="line">Acompanha o resultado</text><rect x="780" y="155" width="284" height="210" rx="14" fill="#e0eefc" stroke="#a7bdcc"/><text x="802" y="189" class="head">API Kubernetes</text><text x="802" y="224" class="line">Recebe declarações</text><text x="802" y="253" class="line">Registra os objetos</text><text x="802" y="282" class="line">Ex.: Deployment</text><text x="802" y="311" class="line">pedindo duas réplicas</text><rect x="710" y="460" width="354" height="145" rx="14" fill="#e3f3e8" stroke="#a7bdcc"/><text x="732" y="494" class="head">Controladores Kubernetes</text><text x="732" y="529" class="line">Observam os recursos</text><text x="732" y="558" class="line">Tentam manter as réplicas</text><text x="732" y="587" class="line">e realizar a configuração</text><path d="M780 340 L740 340 L740 430 L570 430 L570 400" fill="none" stroke="#53788e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="420" y="465" class="sub">Consulta do estado real</text><rect x="36" y="630" width="1028" height="95" rx="14" fill="#ffffff" stroke="#a7bdcc"/><text x="58" y="664" class="head">O portal web permite observar e solicitar operações</text><text x="58" y="699" class="line">Fechar o navegador não interrompe os componentes do Argo CD nem do Kubernetes.</text></svg>