name: Publicar jardim
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jardim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: npm run install-plugins
      - run: npm run validate:content
      - run: npm run test:policies
      - run: npm run test:web
      - run: npm run test:lab
      - name: Construir o site
        run: npm run build:site
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      - name: Verificar saída
        run: node scripts/check-output.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    name: Publicar Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
